<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icon.png" />
    <title>Coffee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(15, 15, 15, 0.55), rgba(15, 15, 15, 0.55)),
                        url('coffeshop.jpg') center/cover no-repeat;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .gif-container img {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            border-radius: 50%;
            box-shadow: 0 18px 40px rgba(255, 77, 109, 0.18);
            transition: transform 0.35s ease;
        }

        .gif-container img:hover {
            transform: translateY(-4px) scale(1.02);
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
            position: relative;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff3355;
        }

        #noBtn {
            background-color: #e0e0e0;
            color: #666;
            position: absolute;
            /* Explicit initial positioning for the script to handle */
            left: 55%; 
        }

        /* Success screen styles */
        .success-message {
            display: none;
        }

        .success-message h2 {
            color: #ff4d6d;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">               
        <!-- Main Question Screen -->
        <div id="questionScreen">
            <div class="gif-container">
                <!-- Using a cute placeholder gif, change URL if you want a specific one -->
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExdHJ1cXZyc241emQ1ZHk3cWVjZTllbGYxcnppcHhpZXU5OGc3OTNrNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/klu2KSBQwdYA/giphy.gif" alt="Cute begging sticker">
            </div>
            <h1>Tara kape tayo? Payag na ako, ikaw? ☕☕</h1>
            <div class="btn-container">
                <button id="yesBtn" onclick="celebrate()">Oo!</button>
                <button id="noBtn" onmouseover="evadeButton()" onclick="evadeButton()">Hindi</button>
            </div>
        </div>

        <!-- Success Screen -->
        <div id="successScreen" class="success-message">
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExYngwOHJuYmt2MWRjM29rNzlheGI1emFoZDA0MGp3eTdiNzJrNWxnYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/93mS3A87wfmOySC29W/giphy.gif" alt="Happy sticker">
            </div>
            <h2>Yay! See you there! </h2>
            <p>I knew you couldn't resist.</p>
        </div>
    </div>

    <script>
        function evadeButton(event) {
            const noBtn = document.getElementById('noBtn');
            const card = document.getElementById('mainCard');
            const cardRect = card.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distance = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);
            const threshold = 120;

            if (distance > threshold && event.target !== noBtn) {
                return;
            }

            const padding = 18;
            const maxX = card.clientWidth - noBtn.clientWidth - padding;
            const maxY = card.clientHeight - noBtn.clientHeight - padding;
            const currentLeft = noBtn.offsetLeft;
            const currentTop = noBtn.offsetTop;

            let moveX = (btnCenterX - mouseX) * 0.8 + (Math.random() - 0.5) * 120;
            let moveY = (btnCenterY - mouseY) * 0.8 + (Math.random() - 0.5) * 80;

            let newLeft = currentLeft + moveX;
            let newTop = currentTop + moveY;

            newLeft = Math.max(padding, Math.min(newLeft, maxX));
            newTop = Math.max(padding, Math.min(newTop, maxY));

            noBtn.style.position = 'absolute';
            noBtn.style.left = `${newLeft}px`;
            noBtn.style.top = `${newTop}px`;
            noBtn.style.visibility = 'visible';
        }

        function celebrate() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
        }

        const card = document.getElementById('mainCard');
        const noBtn = document.getElementById('noBtn');

        card.addEventListener('mousemove', evadeButton);
        noBtn.addEventListener('mouseover', evadeButton);
        noBtn.addEventListener('click', evadeButton);
    </script>

</body>
</html>
